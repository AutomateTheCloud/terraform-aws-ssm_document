---
schemaVersion: "2.2"
description: "Prints a message on Linux instances"
parameters:
  message:
    type: "String"
    description: "The message to print"
    default: "Hello World"
mainSteps:
- precondition:
    StringEquals:
      - "platformType"
      - "Linux"
  action: "aws:runShellScript"
  name: runShellScript
  inputs:
    runCommand:
      - echo "{{ message }}"
